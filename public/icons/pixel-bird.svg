        <rect x="154" y="256" width="26" height="26"/>
        <rect x="128" y="256" width="26" height="26"/>
        <rect x="102" y="256" width="26" height="26"/>
        <rect x="128" y="282" width="26" height="26"/>
        <rect x="154" y="282" width="26" height="26"/>
