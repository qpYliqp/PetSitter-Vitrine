    <!-- Bec -->
    <rect x="358" y="192" style="fill:#FFA500;" width="26" height="26"/>
    <rect x="384" y="205" style="fill:#FFA500;" width="26" height="13"/>
    
    <!-- Corps principal - mauve foncé -->
    <g style="fill:#7B4FA3;">
        <!-- Tête -->
        <rect x="256" y="154" width="26" height="26"/>
        <rect x="282" y="154" width="26" height="26"/>
        <rect x="307" y="154" width="26" height="26"/>
        <rect x="282" y="179" width="26" height="26"/>
        <rect x="256" y="179" width="26" height="26"/>
        
        <!-- Corps -->
        <rect x="230" y="205" width="26" height="26"/>
        <rect x="256" y="205" width="26" height="26"/>
        <rect x="282" y="205" width="26" height="26"/>
        <rect x="307" y="205" width="26" height="26"/>
        <rect x="230" y="230" width="26" height="26"/>
        <rect x="256" y="230" width="26" height="26"/>
        <rect x="282" y="230" width="26" height="26"/>
        <rect x="256" y="256" width="26" height="26"/>
        <rect x="282" y="256" width="26" height="26"/>
    </g>
    
    <!-- Détails mauve clair -->
    <g style="fill:#B18FCF;">
        <rect x="230" y="179" width="26" height="26"/>
